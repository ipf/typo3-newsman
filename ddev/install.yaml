#ddev-generated
# DDEV add-on "newsman" of the TYPO3 extension ipf/newsman.
#
# Adds a local GNU Mailman 3 core (REST API) and its admin interface Postorius to
# a DDEV project, so the subscription form of the extension can be developed and
# tested without a hosted instance. See ddev/README.md in the package.
#
# Install from a project:  ddev add-on get vendor/ipf/newsman/ddev
name: newsman

# v1.24.10 for x-ddev.describe-*, v1.25.4 for the .env.web.newsman file that
# hands the credentials to the web container.
ddev_version_constraint: '>= v1.25.4'

project_files:
  - docker-compose.newsman.yaml
  - newsman/healthcheck.py
  - newsman/postorius-healthcheck.py
  - newsman/settings_local.py

post_install_actions:
  # The flag names are written in lower case and hyphenated: `ddev dotenv set`
  # turns them into the upper case environment variable names the containers and
  # the extension read.
  - |
    #ddev-description: Publish the Mailman REST credentials to the web container
    ddev dotenv set .ddev/.env.web.newsman \
      --mailman-mode=rest \
      --mailman-api-url=http://mailman:8001/3.0 \
      --mailman-api-user=restadmin \
      --mailman-api-password=restpass
  - |
    #ddev-description: Add the development credentials of the two services
    ddev dotenv set .ddev/.env.newsman \
      --mailman-rest-user=restadmin \
      --mailman-rest-password=restpass \
      --postorius-admin-user=admin \
      --postorius-admin-password=admin

removal_actions:
  # The two .env files were written by the post-install actions, so they carry no
  # #ddev-generated marker and DDEV leaves them behind. A file that still holds
  # nothing but the keys written above is removed; one that was extended is kept
  # and reported, because deleting it would drop settings of the project.
  - |
    #ddev-description: Remove the .env files of the add-on
    # DDEV_APPROOT is used because the actions run with the .ddev directory as
    # the working directory, where the relative path would not resolve.
    for file in "${DDEV_APPROOT}/.ddev/.env.web.newsman" "${DDEV_APPROOT}/.ddev/.env.newsman"; do
      if [ ! -f "${file}" ]; then
        continue
      fi
      keys="MAILMAN_API_URL MAILMAN_API_PASSWORD MAILMAN_API_USER MAILMAN_MODE MAILMAN_REST_PASSWORD MAILMAN_REST_USER POSTORIUS_ADMIN_PASSWORD POSTORIUS_ADMIN_USER"
      if grep -qvE "^($(echo ${keys} | tr ' ' '|'))=|^$" "${file}"; then
        echo "Keeping ${file}: it holds keys the add-on did not write."
        continue
      fi
      rm -f "${file}"
      echo "Removed ${file}"
    done
